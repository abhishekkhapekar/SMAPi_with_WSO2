spring.application.name=smapi

# Context path
server.servlet.context-path=/smapi

# ===============================
# Database Connection Properties
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/smapi_db
spring.datasource.username=smapi_user
spring.datasource.password=smapi_password
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate Properties
# ===============================
# Show SQL queries in console
spring.jpa.show-sql=true

# Hibernate ddl auto (options: none, validate, update, create, create-drop)
spring.jpa.hibernate.ddl-auto=update

# Dialect for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
